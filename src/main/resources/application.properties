spring.application.name=itpassport-app

# RailwayはPORT環境変数でリッスンすべきポートを指示してくる。
server.port=${PORT:8080}

# Railway ではPostgresサービスをリンクするとPGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORDが自動注入される。
# ローカルではdocker-compose.ymlのデフォルト値(localhost/itpassport/itpassport)にフォールバックする。
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:itpassport}
spring.datasource.username=${PGUSER:itpassport}
spring.datasource.password=${PGPASSWORD:itpassport}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.thymeleaf.cache=false

# RailwayなどTLSを終端するプロキシ配下で動かす際、X-Forwarded-*ヘッダーからHTTPS判定させる
# (ゲストCookieのSecure属性やリダイレクトURLの生成に影響するため)。
server.forward-headers-strategy=framework

# セッションCookieのセキュリティ属性を明示(Secureは自動判定に任せる: HTTPSリクエスト時のみ付与)。
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# パスワードリセットメール送信用のSMTP設定。認証情報は環境変数で渡し、コードにはコミットしない。
# Gmailを使う場合はGoogleアカウントの「アプリパスワード」を発行してMAIL_PASSWORDに設定する。
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# パスワードリセットリンクの生成に使うベースURL。Railwayでは実際の公開ドメインを設定する。
app.base-url=${APP_BASE_URL:http://localhost:8080}
