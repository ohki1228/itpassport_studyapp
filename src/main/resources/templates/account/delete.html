<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>アカウントの削除 | ITパスポート学習</title>
    <script>
        (function () {
            var saved = localStorage.getItem("theme");
            if (saved !== "light") {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container">
    <div class="card">
        <h1>アカウントの削除</h1>
        <p th:if="${error}" class="result-incorrect" th:text="${error}">エラー</p>

        <div th:if="${targetUserType.name() == 'REGISTERED'}">
            <p>アカウントを削除すると、回答履歴を含むすべてのデータが完全に削除されます。この操作は取り消せません。</p>
            <form method="post" th:action="@{/account/delete}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <p><label>確認のため、パスワードを入力してください<br>
                    <input type="password" name="password" required></label></p>
                <button class="btn" style="background-color:#c53030;" type="submit">アカウントを完全に削除する</button>
            </form>
        </div>

        <div th:unless="${targetUserType.name() == 'REGISTERED'}">
            <p>ゲストとして保存された回答履歴などのデータを今すぐ削除します。この操作は取り消せません。</p>
            <form method="post" th:action="@{/account/delete}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="btn" style="background-color:#c53030;" type="submit">ゲストデータを削除する</button>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
