<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>パスワードをお忘れの場合 | ITパスポート学習</title>
    <script>
        (function () {
            var saved = localStorage.getItem("theme");
            if (saved !== "light") {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container">
    <div class="card">
        <h1>パスワードをお忘れの場合</h1>

        <div th:if="${submitted}">
            <p class="result-correct">
                ご登録のメールアドレス宛に、パスワード再設定用のメールを送信しました(該当するアカウントが存在する場合)。
            </p>
            <p>メールが届かない場合は、迷惑メールフォルダをご確認いただくか、しばらく待ってから再度お試しください。</p>
        </div>

        <form th:unless="${submitted}" method="post" th:action="@{/forgot-password}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <p><label>登録済みのメールアドレス<br>
                <input type="email" name="email" required autofocus></label></p>
            <button class="btn" type="submit">再設定メールを送信</button>
        </form>

        <p><a th:href="@{/login}">ログイン画面に戻る</a></p>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
