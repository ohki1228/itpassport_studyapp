<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ログイン | ITパスポート学習</title>
    <script>
        (function () {
            var saved = localStorage.getItem("theme");
            if (saved !== "light") {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container">
    <div class="card">
        <h1>ログイン</h1>
        <p th:if="${param.error}" class="result-incorrect">メールアドレスまたはパスワードが正しくありません。</p>
        <p th:if="${param.logout}" class="result-correct">ログアウトしました。</p>
        <p th:if="${param.reset}" class="result-correct">パスワードを再設定しました。新しいパスワードでログインしてください。</p>
        <form method="post" th:action="@{/login}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <p><label>メールアドレス<br><input type="email" name="email" required autofocus></label></p>
            <p><label>パスワード<br><input type="password" name="password" required></label></p>
            <button class="btn" type="submit">ログイン</button>
        </form>
        <p><a th:href="@{/forgot-password}">パスワードをお忘れの場合</a></p>
        <p>アカウントをお持ちでない場合は <a th:href="@{/register}">こちらから登録</a>
            (ゲストとして回答した履歴もそのまま引き継がれます)。</p>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
