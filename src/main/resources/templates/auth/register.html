<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>会員登録 | ITパスポート学習</title>
    <script>
        (function () {
            var saved = localStorage.getItem("theme");
            if (saved !== "light") {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container">
    <div class="card">
        <h1>会員登録</h1>
        <p>ゲストとして回答した履歴はそのまま引き継がれます。</p>
        <p th:if="${error}" class="result-incorrect" th:text="${error}">エラー</p>
        <form method="post" th:action="@{/register}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <p><label>メールアドレス<br><input type="email" name="email" required autofocus></label></p>
            <p><label>パスワード(8文字以上)<br><input type="password" name="password" required minlength="8"></label></p>
            <p><label>表示名(任意)<br><input type="text" name="displayName"></label></p>
            <button class="btn" type="submit">登録する</button>
        </form>
        <p style="font-size:0.85rem; color:#666;">
            登録すると、<a th:href="@{/privacy}">プライバシーポリシー</a>と<a th:href="@{/terms}">利用規約</a>に同意したものとみなします。
        </p>
        <p>既にアカウントをお持ちの場合は <a th:href="@{/login}">こちらからログイン</a>。</p>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
