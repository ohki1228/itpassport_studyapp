<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新しいパスワードの設定 | ITパスポート学習</title>
    <script>
        (function () {
            var saved = localStorage.getItem("theme");
            if (saved !== "light") {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container">
    <div class="card">
        <h1>新しいパスワードの設定</h1>

        <div th:if="${invalid}">
            <p class="result-incorrect">このリンクは無効か、有効期限が切れています。</p>
            <p><a th:href="@{/forgot-password}">もう一度リクエストする</a></p>
        </div>

        <form th:unless="${invalid}" method="post" th:action="@{/reset-password}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="token" th:value="${token}"/>
            <p th:if="${error}" class="result-incorrect" th:text="${error}">エラー</p>
            <p><label>新しいパスワード(8文字以上)<br>
                <input type="password" name="password" required minlength="8" autofocus></label></p>
            <button class="btn" type="submit">パスワードを再設定する</button>
        </form>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
