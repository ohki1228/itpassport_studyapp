<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav class="navbar" th:fragment="nav">
    <a th:href="@{/}">ホーム</a>
    <a th:href="@{/knowledge}">基礎知識</a>
    <a th:href="@{/quiz/practice/start}">演習問題</a>
    <a th:href="@{/quiz/weakness/start}">苦手克服</a>
    <a th:href="@{/mock-exam/start}">実践演習</a>

    <span class="nav-account" th:if="${currentUser != null and currentUser.userType.name() == 'GUEST'}">
        ゲスト利用中
        <a th:href="@{/login}">ログイン</a>
        <a th:href="@{/register}">会員登録</a>
        <a th:href="@{/account/delete}" class="nav-account-muted">データ削除</a>
    </span>
    <span class="nav-account" th:if="${currentUser != null and currentUser.userType.name() == 'REGISTERED'}">
        <span th:text="${currentUser.displayName != null ? currentUser.displayName : currentUser.email}">ユーザー名</span>
        <form method="post" th:action="@{/logout}" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="link-button">ログアウト</button>
        </form>
        <a th:href="@{/account/delete}" class="nav-account-muted">アカウント削除</a>
    </span>
    <button type="button" class="theme-toggle" aria-label="ダークモードに切り替え">☽</button>
    <script th:src="@{/js/theme.js}"></script>
</nav>
</body>
</html>
