<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${term.term} + ' | 用語集'">用語集</title>
    <script>
        (function () {
            var saved = localStorage.getItem("theme");
            if (saved !== "light") {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container">
    <p><a th:href="@{/glossary}">&laquo; 用語集一覧に戻る</a></p>
    <div class="card">
        <h1 th:text="${term.term}">用語</h1>
        <p th:text="${term.definition}">意味</p>

        <div th:if="${term.breakdown}">
            <strong>内訳</strong>
            <p style="white-space: pre-wrap;" th:text="${term.breakdown}"></p>
        </div>

        <p th:if="${!#lists.isEmpty(relatedTermLinks)}">
            <strong>関連用語: </strong>
            <span th:each="rt, iter : ${relatedTermLinks}">
                <a th:if="${rt.termId() != null}" th:href="@{/glossary/{id}(id=${rt.termId()})}" th:text="${rt.text()}">用語</a>
                <span th:unless="${rt.termId() != null}" th:text="${rt.text()}">用語</span>
                <span th:unless="${iter.last}">、</span>
            </span>
        </p>

        <p>
            <strong>関連項目: </strong>
            <span th:text="${term.genre.category.name}">大分類</span>
            <span th:if="${term.genre != null}">
                &gt; <a th:href="@{/knowledge/{id}(id=${term.genre.id})}" th:text="${term.genre.name}">ジャンル名</a>
            </span>
            <span th:if="${term.knowledge != null}">
                &gt; <a th:href="@{/knowledge/{genreId}/{knowledgeId}(genreId=${term.genre.id}, knowledgeId=${term.knowledge.id})}"
                       th:text="${term.knowledge.title}">単元名</a>
            </span>
        </p>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
