<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用語集 | ITパスポート学習</title>
    <script>
        (function () {
            var saved = localStorage.getItem("theme");
            if (saved !== "light") {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container">
    <h1>用語集</h1>
    <p>
        <span th:if="${view == 'genre'}">ジャンル別</span>
        <a th:unless="${view == 'genre'}" th:href="@{/glossary(view='genre')}">ジャンル別</a>
        &nbsp;|&nbsp;
        <span th:if="${view == 'reading'}">50音順</span>
        <a th:unless="${view == 'reading'}" th:href="@{/glossary(view='reading')}">50音順</a>
    </p>
    <p>
        <input type="text" id="termFilter" placeholder="用語を検索" autocomplete="off"
               style="width: 100%; max-width: 320px; padding: 6px;">
    </p>

    <div th:if="${view != 'reading'}">
        <div class="card" th:each="cg : ${categoryGenres}">
            <h2 th:text="${cg.category().name}">大分類</h2>
            <div th:each="genre : ${cg.genres()}">
                <h3 th:text="${genre.name}">ジャンル名</h3>
                <ul>
                    <li th:each="term : ${termsByGenreId.get(genre.id)}" th:data-term="${term.term}">
                        <a th:href="@{/glossary/{id}(id=${term.id})}" th:text="${term.term}">用語</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div th:if="${view == 'reading'}">
        <div class="card" th:each="row : ${gojuonRows}">
            <p style="margin-top: 0;">
                <span th:each="r : ${gojuonRows}" style="margin-right: 0.5em;">
                    <strong th:if="${r.id() == row.id()}" th:id="'row-' + ${row.id()}" th:text="${r.label()}"
                            style="font-size: 1.4rem;">あ</strong>
                    <a th:unless="${r.id() == row.id()}" th:href="'#row-' + ${r.id()}" th:text="${r.label()}"></a>
                </span>
            </p>
            <ul style="padding-left: 2em;">
                <li th:each="term : ${row.terms()}" th:data-term="${term.term}">
                    <a th:href="@{/glossary/{id}(id=${term.id})}" th:text="${term.term}">用語</a>
                    <span style="color: #888; font-size: 0.9em;" th:text="'(' + ${term.reading} + ')'">(よみ)</span>
                </li>
            </ul>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:inline="javascript">
    document.getElementById('termFilter').addEventListener('input', function (e) {
        var q = e.target.value.trim().toLowerCase();
        document.querySelectorAll('li[data-term]').forEach(function (li) {
            var term = li.getAttribute('data-term').toLowerCase();
            li.style.display = (q === '' || term.indexOf(q) !== -1) ? '' : 'none';
        });
    });
</script>
</body>
</html>
