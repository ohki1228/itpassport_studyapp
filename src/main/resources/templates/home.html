<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ホーム | ITパスポート学習</title>
    <script>
        (function () {
            var saved = localStorage.getItem("theme");
            if (saved !== "light") {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container">
    <p th:if="${param.accountDeleted}" class="result-correct">アカウントを削除しました。ご利用ありがとうございました。</p>
    <div class="card">
        <h2>ITパスポート学習</h2>
        <p class="stat-hero">全体正答率
            <strong th:text="${#numbers.formatDecimal(overallAccuracy, 1, 1)} + '%'">0.0%</strong>
        </p>
    </div>

    <div class="card">
        <h2>各機能</h2>
        <div class="menu-grid">
            <a class="menu-item" th:href="@{/knowledge}">基礎知識学習</a>
            <a class="menu-item" th:href="@{/mock-exam/start}">実践演習</a>
            <a class="menu-item" th:href="@{/quiz/practice/start}">演習問題</a>
            <a class="menu-item" th:href="@{/quiz/weakness/start}">苦手克服</a>
        </div>
    </div>

    <div class="card">
        <h2>苦手ジャンル</h2>
        <p th:if="${#lists.isEmpty(weakGenres)}">現在、苦手と判定されているジャンルはありません(各ジャンル5問以上回答すると判定されます)。</p>
        <table th:unless="${#lists.isEmpty(weakGenres)}">
            <thead>
            <tr>
                <th>ジャンル</th>
                <th>正答率</th>
                <th>判定</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="stat : ${weakGenres}">
                <td th:text="${stat.genre().name}">ジャンル名</td>
                <td th:text="${#numbers.formatDecimal(stat.accuracy(), 1, 1)} + '%'">0.0%</td>
                <td><span th:class="'badge badge-' + ${stat.judgement().cssClass()}" th:text="${stat.judgement().label()}">苦手</span></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="card">
        <h2>ジャンル別正答率</h2>
        <table>
            <thead>
            <tr>
                <th>ジャンル</th>
                <th>回答数</th>
                <th>正答率</th>
                <th>判定</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="stat : ${genreStats}">
                <td th:text="${stat.genre().name}">ジャンル名</td>
                <td th:text="${stat.totalCount()}">0</td>
                <td th:text="${#numbers.formatDecimal(stat.accuracy(), 1, 1)} + '%'">0.0%</td>
                <td><span th:class="'badge badge-' + ${stat.judgement().cssClass()}" th:text="${stat.judgement().label()}">普通</span></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
