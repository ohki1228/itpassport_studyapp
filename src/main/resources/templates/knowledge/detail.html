<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${knowledge.title} + ' | ' + ${genre.name}">基礎知識</title>
    <script>
        (function () {
            var saved = localStorage.getItem("theme");
            if (saved !== "light") {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container">
    <p>
        <a th:href="@{/knowledge}">基礎知識一覧</a> &raquo;
        <a th:href="@{/knowledge/{id}(id=${genre.id})}" th:text="${genre.name}">ジャンル名</a>
    </p>
    <p style="color: #888;" th:text="${unitNumber} + ' / ' + ${unitCount}">1 / 8</p>

    <div class="card">
        <h1 th:text="${knowledge.title}">単元名</h1>
        <p style="white-space: pre-wrap;" th:text="${knowledge.body}">基礎解説</p>
        <p th:if="${knowledge.point}"><strong>よく出るポイント: </strong><span style="white-space: pre-wrap;" th:text="${knowledge.point}"></span></p>
        <p th:if="${knowledge.keywords}">
            <strong>重要語句: </strong>
            <span th:each="kw, iter : ${keywordLinks}">
                <a th:if="${kw.termId() != null}" th:href="@{/glossary/{id}(id=${kw.termId()})}" th:text="${kw.text()}">用語</a>
                <span th:unless="${kw.termId() != null}" th:text="${kw.text()}">用語</span>
                <span th:unless="${iter.last}">、</span>
            </span>
        </p>
    </div>

    <div style="display: flex; justify-content: space-between; margin-top: 1em;">
        <span style="text-align: left;">
            <a th:if="${prev != null}"
               th:href="@{/knowledge/{genreId}/{knowledgeId}(genreId=${genre.id}, knowledgeId=${prev.id})}">
                &laquo; <span th:text="${prev.title}">前の単元</span>
            </a>
        </span>
        <span style="text-align: right;">
            <a th:if="${next != null}"
               th:href="@{/knowledge/{genreId}/{knowledgeId}(genreId=${genre.id}, knowledgeId=${next.id})}">
                <span th:text="${next.title}">次の単元</span> &raquo;
            </a>
        </span>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
