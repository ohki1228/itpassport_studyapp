<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${genre.name} + ' | 基礎知識'">基礎知識</title>
    <script>
        (function () {
            var saved = localStorage.getItem("theme");
            if (saved !== "light") {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container">
    <p><a th:href="@{/knowledge}">&laquo; 基礎知識一覧に戻る</a></p>
    <h1 th:text="${genre.name}">ジャンル名</h1>
    <p><a th:href="@{/glossary}">用語集で調べる &raquo;</a></p>

    <div class="card">
        <ol>
            <li th:each="k, iter : ${knowledgeList}">
                <a th:href="@{/knowledge/{genreId}/{knowledgeId}(genreId=${genre.id}, knowledgeId=${k.id})}"
                   th:text="${k.title}">単元名</a>
            </li>
        </ol>
    </div>

    <p th:if="${#lists.isEmpty(knowledgeList)}">このジャンルの基礎知識コンテンツは準備中です。</p>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
