<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>基礎知識 | ITパスポート学習</title>
    <script>
        (function () {
            var saved = localStorage.getItem("theme");
            if (saved !== "light") {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container">
    <p><a th:href="@{/glossary}">用語集で調べる &raquo;</a></p>
    <div class="card" th:each="cg : ${categoryGenres}">
        <h2 th:text="${cg.category().name}">大分類</h2>
        <ul>
            <li th:each="genre : ${cg.genres()}">
                <a th:href="@{/knowledge/{id}(id=${genre.id})}" th:text="${genre.name}">ジャンル名</a>
            </li>
        </ul>
    </div>
    <p class="revision-date">
        基礎知識の内容は、独立行政法人情報処理推進機構(IPA)公表の「ITパスポート試験シラバス Ver.6.5」を参考に作成しています。
    </p>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
