<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>実践演習 | ITパスポート学習</title>
    <script>
        (function () {
            var saved = localStorage.getItem("theme");
            if (saved !== "light") {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container">
    <div class="card">
        <p class="progress-text">
            実践演習 —
            <span th:text="${progressCurrent} + ' / ' + ${progressTotal} + '問'">1 / 100問</span>
            — 残り時間: <span id="mock-exam-timer">--:--</span>
        </p>

        <h2 style="white-space: pre-wrap;" th:text="${question.questionText}">問題文</h2>
        <div th:replace="~{fragments/question-table :: table(${question.tableRows})}"></div>
        <p th:if="${question.answerType.name() == 'MULTIPLE'}">
            <em>この問題は複数選択です(<span th:text="${question.requiredAnswerCount}">2</span>つ選んでください)。</em>
        </p>

        <form method="post" th:action="@{/mock-exam/answer}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <ul class="choice-list">
                <li th:each="choice, choiceStat : ${question.choices}">
                    <label>
                        <input th:if="${question.answerType.name() == 'SINGLE'}"
                               type="radio" name="choices" th:value="${choice.choiceNumber}" required>
                        <input th:if="${question.answerType.name() == 'MULTIPLE'}"
                               type="checkbox" name="choices" th:value="${choice.choiceNumber}">
                        <span th:text="${{'①','②','③','④'}[choiceStat.index] + ' ' + choice.content}">選択肢</span>
                    </label>
                </li>
            </ul>
            <button class="btn" type="submit">次の問題へ</button>
        </form>
    </div>
</main>
<script th:inline="javascript">
    let remaining = /*[[${remainingSeconds}]]*/ 7200;
    const timerEl = document.getElementById('mock-exam-timer');

    function render() {
        const m = Math.floor(remaining / 60);
        const s = remaining % 60;
        timerEl.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    render();
    const intervalId = setInterval(function () {
        remaining -= 1;
        if (remaining <= 0) {
            clearInterval(intervalId);
            window.location.href = /*[[@{/mock-exam/timeout}]]*/ '/mock-exam/timeout';
            return;
        }
        render();
    }, 1000);
</script>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
