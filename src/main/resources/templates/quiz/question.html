<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modeLabel} + ' | ITパスポート学習'">演習</title>
    <script>
        (function () {
            var saved = localStorage.getItem("theme");
            if (saved !== "light") {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container">
    <div class="card">
        <p class="progress-text">
            <span th:text="${modeLabel}">演習問題</span> —
            <span th:if="${progressTotal != null}" th:text="${progressCurrent} + ' / ' + ${progressTotal} + '問'">1 / 25問</span>
            <span th:if="${progressTotal == null}" th:text="${progressCurrent} + '問目(エンドレス)'">1問目</span>
        </p>

        <h2 style="white-space: pre-wrap;" th:text="${question.questionText}">問題文</h2>
        <div th:replace="~{fragments/question-table :: table(${question.tableRows})}"></div>
        <p th:if="${question.source}" style="color:#888; font-size:0.85rem;" th:text="${question.source}">出典</p>
        <p th:if="${question.answerType.name() == 'MULTIPLE'}">
            <em>この問題は複数選択です(<span th:text="${question.requiredAnswerCount}">2</span>つ選んでください)。</em>
        </p>

        <form method="post" th:action="@{'/quiz/' + ${mode} + '/answer'}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <ul class="choice-list">
                <li th:each="choice, choiceStat : ${question.choices}">
                    <label>
                        <input th:if="${question.answerType.name() == 'SINGLE'}"
                               type="radio" name="choices" th:value="${choice.choiceNumber}" required>
                        <input th:if="${question.answerType.name() == 'MULTIPLE'}"
                               type="checkbox" name="choices" th:value="${choice.choiceNumber}">
                        <span th:text="${{'①','②','③','④'}[choiceStat.index] + ' ' + choice.content}">選択肢</span>
                    </label>
                </li>
            </ul>
            <button class="btn" type="submit">回答する</button>
        </form>

        <p style="margin-top:1.5rem;">
            <a th:href="@{'/quiz/' + ${mode} + '/finish'}">ここまでで終了して結果を見る</a>
        </p>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
