<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modeLabel} + ' | ITパスポート学習'">演習</title>
    <script>
        (function () {
            var saved = localStorage.getItem("theme");
            if (saved !== "light") {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container">
    <div class="card">
        <h1 th:text="${modeLabel}">演習問題</h1>

        <div th:if="${mode == 'weakness'}">
            <p th:if="${#lists.isEmpty(weakGenres)}">
                現在、苦手と判定されているジャンルはまだありません(各ジャンル5問以上回答すると判定されます)。
                その場合は全ジャンルからバランスよく出題します。
            </p>
            <div th:unless="${#lists.isEmpty(weakGenres)}">
                <p>次のジャンルを中心に出題します:</p>
                <ul>
                    <li th:each="stat : ${weakGenres}"
                        th:text="${stat.genre().name} + '(' + ${stat.judgement().label()} + ' ' + ${#numbers.formatDecimal(stat.accuracy(),1,1)} + '%)'">
                        ジャンル名
                    </li>
                </ul>
            </div>
        </div>

        <form method="post" th:action="@{'/quiz/' + ${mode} + '/start'}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <p>出題数を選んでください。</p>
            <label><input type="radio" name="count" value="25" checked> 25問</label><br>
            <label><input type="radio" name="count" value="50"> 50問</label><br>
            <label><input type="radio" name="count" value="100"> 100問</label><br>
            <label><input type="radio" name="count" value="endless"> エンドレス</label><br>
            <br>
            <button class="btn" type="submit">開始する</button>
        </form>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
